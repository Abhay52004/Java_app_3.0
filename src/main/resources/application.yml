management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: minikube-sample

logging:
  level:
    org.springframework.cloud.kubernetes: DEBUG

spring:
  application:
    name: minikube-sample
